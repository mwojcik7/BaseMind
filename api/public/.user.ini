; BaseMind — PHP hardening for CGI/FastCGI/PHP-FPM hosting (read per directory).
; On mod_php hosting the same values are set in .htaccess (<IfModule mod_php.c>).
; See projekt.md, section 8.

; Mitigation for CVE-2026-109619 (PHP2Shell) and CVE-2026-115560.
session.upload_progress.enabled = Off
; Mitigation for PHP2Shell on PHP 8.5.
fatal_error_backtraces = Off

display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1

; Uploads (receipts, photos). Big files are sent in chunks by the PWA.
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
memory_limit = 256M
